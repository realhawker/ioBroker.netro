# Dependabot will run on day 14 of each month at 02:01 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "1 2 14 * *"
    open-pull-requests-limit: 20
    assignees:
      - "realhawker"
    versioning-strategy: "increase"
